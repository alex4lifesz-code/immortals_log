# ============================================
# Immortals Log — Docker Compose
# Works locally and in Portainer
# ============================================

services:
  app:
    image: "${IMAGE_NAME:-ghcr.io/alex4lifesz-code/immortals_log}:${IMAGE_TAG:-latest}"
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/cultivation.db
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-in-portainer}
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      RESET_DB: ${RESET_DB:-false}
    volumes:
      - wuxia_data:/app/data
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  wuxia_data:
    driver: local
