services:
  immortals-log:
    container_name: immortals-log
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 2048m
    cpus: 2.0
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=1536
      PORT: "${PORT:-4400}"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: "file:/app/data/immortals.db"
      JWT_SECRET: "${JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET}"
      APP_URL: "${APP_URL:-http://localhost:4400}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:4400}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - immortals_log_data:/app/data
    command:
      - /bin/sh
      - -c
      - export DATABASE_URL="$${DATABASE_URL:-file:/app/data/immortals.db}"; npx prisma migrate deploy && npm run start -- -H 0.0.0.0 -p $${PORT:-4400}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-4400}/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    ports:
      - "${HOST_BIND:-0.0.0.0}:${PORT:-4400}:${PORT:-4400}"
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
    networks:
      - immortals

networks:
  immortals:
    driver: bridge

volumes:
  immortals_log_data:
