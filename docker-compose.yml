services:
  immortals-log:
    image: ghcr.io/alex4lifesz-code/immortals-log:latest
    container_name: immortals-log
    restart: unless-stopped
    mem_limit: 2048m
    cpus: 2.0
    environment:
      TZ: Etc/UTC
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=1536
      PORT: "4400"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: file:/app/data/immortals.db
      APP_URL: http://192.168.1.115:4400
      NEXT_PUBLIC_APP_URL: http://192.168.1.115:4400
      JWT_SECRET: CHANGE_ME_TO_A_LONG_RANDOM_SECRET
      COOKIE_SECURE: "false"
    volumes:
      - immortals_log_data:/app/data
    command: >
      sh -c 'npx prisma migrate deploy && npm run start -- -H 0.0.0.0 -p 4400'
    ports:
      - "4400:4400"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4400/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  immortals_log_data:
