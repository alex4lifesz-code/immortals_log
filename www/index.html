<!DOCTYPE html>
<html lang="en" class="native-apk dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <meta name="color-scheme" content="dark" />
  <title>Immortal's Log</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0f14;
      color: #dce4ef;
      font-family: "Roboto", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loader {
      text-align: center;
      opacity: 0.7;
    }
    .loader p {
      font-size: 14px;
      letter-spacing: 0.05em;
    }
    .loader .dot-pulse {
      display: inline-flex;
      gap: 4px;
      margin-top: 12px;
    }
    .loader .dot-pulse span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3a8f8f;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .loader .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
    .loader .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="loader">
    <p>Loading Immortal's Log&hellip;</p>
    <div class="dot-pulse"><span></span><span></span><span></span></div>
  </div>
</body>
</html>
