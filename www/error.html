<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Connection Error</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0d0f14; color: #dce4ef;
      font-family: "Roboto", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .error-card {
      text-align: center; max-width: 320px;
    }
    .error-card .icon {
      font-size: 48px; margin-bottom: 16px; opacity: 0.6;
    }
    .error-card h1 {
      font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #c43030;
    }
    .error-card p {
      font-size: 14px; opacity: 0.7; line-height: 1.5; margin-bottom: 24px;
    }
    .retry-btn {
      display: inline-block;
      padding: 12px 32px;
      background: #1a4a4a;
      color: #5bbfbf;
      border: 1px solid #2d6b6b;
      border-radius: 8px;
      font-size: 14px; font-weight: 500;
      cursor: pointer;
      min-height: 48px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .retry-btn:active {
      background: #2d6b6b;
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="icon">⚠️</div>
    <h1>Connection Lost</h1>
    <p>Unable to reach the server. Check your network connection and try again.</p>
    <button class="retry-btn" onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
