services:
  immortals-log:
    container_name: immortals-log
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "4400"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: "file:/app/data/immortals.db"
      JWT_SECRET: REPLACE_WITH_A_LONG_RANDOM_SECRET
      APP_URL: http://YOUR_LAN_IP:4400
      NEXT_PUBLIC_APP_URL: http://YOUR_LAN_IP:4400
      COOKIE_SECURE: "false"
    volumes:
      - immortals_log_data:/app/data
    command:
      - /bin/sh
      - -c
      - export DATABASE_URL="${DATABASE_URL:-file:/app/data/immortals.db}"; npx prisma migrate deploy && npm run start -- -H 0.0.0.0 -p 4400
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4400/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    ports:
      - "4400:4400"
    networks:
      - immortals_lan

networks:
  immortals_lan:
    driver: bridge

volumes:
  immortals_log_data:
